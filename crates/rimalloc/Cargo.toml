[package]
name = "rimalloc"
description = "A pure-Rust port of mimalloc: a compact, fast general-purpose allocator"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
libc = { version = "0.2", default-features = false }
# Load-time constructor to register `pthread_atfork` before any thread or
# fork exists; only the proc-macro attribute is needed (no priority).
ctor = { version = "1.0.7", default-features = false, features = ["proc_macro", "std"] }

[features]
default = []
# Maintain allocation statistics (MI_STAT).
stats = []
# Security mitigations (MI_SECURE 3/4): encoded free lists with per-page
# random keys, corrupted-list and double-free detection.
secure = []
# Debug fill patterns (MI_DEBUG): stamp 0xD0 over fresh blocks and 0xDF
# over freed blocks to surface use-of-uninitialized and use-after-free.
debug-fill = []
# Raw `#[thread_local]` statics for the hot-path TLS slots (requires a
# nightly compiler); the default stable path uses `thread_local!`.
nightly = []

[lints]
workspace = true

[dev-dependencies]
libc = "0.2"

[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"
