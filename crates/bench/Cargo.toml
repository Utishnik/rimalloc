[package]
name = "rimalloc-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
rimalloc = { path = "../rimalloc", optional = true }
mimalloc = { version = "0.1", default-features = false, optional = true }
serde_json = "1.0.150"
regex = "1.12.4"
libc = "0.2.186"

[features]
default = ["alloc-rimalloc"]
alloc-rimalloc = ["dep:rimalloc"]
alloc-mimalloc = ["dep:mimalloc"]
alloc-system = []

[[bin]]
name = "bench"
path = "src/main.rs"

[lints]
workspace = true
