[workspace]
resolver = "3"
members = ["crates/rimalloc", "crates/bench", "r3"]
exclude = ["crates/rimalloc/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/moggedhedien/rimalloc"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "allow"
# `loom` is set by the loom test harness, `fuzzing` by cargo-fuzz — both
# external to a normal build, so declare them for the unexpected_cfgs lint.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(fuzzing)'] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
missing_safety_doc = "warn"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.bench]
lto = true
codegen-units = 1
